<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی | CodaX Academy</title>
    <link rel="stylesheet" href="styles/index-style.css">
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="icon" type="image/jpeg" href="images/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d4ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CodaX">
    <script src="configs/index-config.js"></script>
    <script src="js/codax-utils.js"></script>
</head>
<body>

    <header style="width:100%; max-width:500px; display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; padding:0.5rem 1rem; background:rgba(10,14,26,0.5); border-radius:16px; border:1px solid rgba(0,212,255,0.06);">
        <div style="display:flex; align-items:center; gap:0.8rem;">
            <img src="images/logo.jpeg" alt="Logo" style="width:40px; height:40px; border-radius:12px; object-fit:cover; border:1px solid rgba(0,212,255,0.15);">
            <div>
                <h1 style="font-size:1.1rem; color:#00d4ff; margin:0; font-family:'Courier New',monospace;">آکادمی CodaX</h1>
                <p style="font-size:0.6rem; color:rgba(0,212,255,0.5); margin:0; letter-spacing:2px; font-family:'Courier New',monospace;">CodaX Academy</p>
            </div>
        </div>
        <button id="themeToggle" title="Select Theme" style="background:transparent; border:1px solid rgba(0,212,255,0.1); padding:0.4rem 0.8rem; border-radius:8px; color:#00d4ff; cursor:pointer; font-family:'Courier New',monospace; font-size:0.9rem; transition:all 0.3s ease;">🌙</button>
    </header>

    <div class="logo-wrapper">
        <img src="images/logo.jpeg" class="main-logo" alt="Logo">
    </div>

    <div class="glass-card">
        <h1>CodaX Academy</h1>
        <p>مسیر خود را انتخاب کنید</p>
        <div id="course-list"></div>
    </div>

    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h2>🎓 خوش آمدید</h2>
            <p style="margin:1rem 0;">هستۀ کد به دست تو | CodaX</p>
            <a href="https://ble.ir/CodaX" class="btn-link">ورود به کانال بله 👉</a>
            <a href="https://ble.ir/CodaX_Admin" class="btn-link" style="background:transparent; color:#00d4ff; border:1px solid #00d4ff;">ارتباط با ادمین</a>
            <button onclick="document.getElementById('welcomeModal').style.display='none'" style="margin-top:10px; background:none; border:none; color:#8899aa; cursor:pointer;">بستن</button>
        </div>
    </div>
    <!-- دکمه نصب PWA -->
<button id="installPWA" style="display:none; position: fixed; bottom: 20px; left: 20px; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.4); border-radius: 12px; padding: 0.8rem 1.5rem; color: #00d4ff; cursor: pointer; font-family: 'Courier New', monospace; font-size: 0.9rem; font-weight: 600; z-index: 9999;">
    📱 نصب CodaX
</button>

<script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        
        // نمایش دکمه
        const installBtn = document.getElementById('installPWA');
        installBtn.style.display = 'block';
        
        installBtn.addEventListener('click', function() {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(choiceResult) {
                if (choiceResult.outcome === 'accepted') {
                    console.log('✅ کاربر نصب رو قبول کرد');
                } else {
                    console.log('❌ کاربر نصب رو رد کرد');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            });
        });
    });

    // وقتی نصب شد
    window.addEventListener('appinstalled', function() {
        console.log('✅ CodaX نصب شد');
    });
</script>
    <script>
    (function() {
        // ============================================
        // ۱. نمایش دوره‌ها
        // ============================================
        var container = document.getElementById('course-list');
        if (typeof coursesConfig !== 'undefined' && coursesConfig.length > 0) {
            container.innerHTML = '';
            for (var i = 0; i < coursesConfig.length; i++) {
                var course = coursesConfig[i];
                var link = document.createElement('a');
                link.className = 'course-card';
                link.href = course.url;
                link.innerHTML = '🚀 ' + course.title;
                container.appendChild(link);
            }
        }

        // ============================================
        // ۲. مودال خوش‌آمدگویی
        // ============================================
        if (localStorage.getItem('codax_welcome_shown')) {
            document.getElementById('welcomeModal').style.display = 'none';
        } else {
            document.getElementById('welcomeModal').style.display = 'flex';
            localStorage.setItem('codax_welcome_shown', 'true');
        }

        // ============================================
        // ۳. ثبت Service Worker
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker ثبت شد:', registration.scope);
                    })
                    .catch(function(err) {
                        console.warn('⚠️ Service Worker ثبت نشد:', err);
                    });
            });
        }

        console.log('⚡ Index page ready!');
    })();
    </script>
</body>
</html>
