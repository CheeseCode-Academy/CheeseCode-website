<div class="lesson-content" dir="auto">
    <h1 class="lesson-title">🧀 جواب درس: عملگرهای &gt; و &gt;&gt;</h1>
    <div class="lesson-meta">سطح: مقدماتی | جواب تمرین</div>

    <section class="section">
        <h2>📝 تمرین</h2>
        <div class="exercise-box">
            <p><strong>تمرین:</strong> با <code>echo</code> یه متن رو در فایل ذخیره کن و بعد با <code>&gt;&gt;</code> اضافه کن.</p>
        </div>
    </section>

    <section class="section">
        <h2>✅ جواب</h2>
        <pre class="code-block">echo "Hello" &gt; file.txt
echo "World" &gt;&gt; file.txt
cat file.txt</pre>
        <div class="output-box">
            <span class="output-label">خروجی:</span>
            <pre class="code-block-output">Hello
World</pre>
        </div>
    </section>
</div>
