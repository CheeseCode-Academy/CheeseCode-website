<div class="lesson-content" dir="auto">
    <h1 class="lesson-title">🧀 جواب درس: دستور chmod</h1>
    <div class="lesson-meta">سطح: متوسط | جواب تمرین</div>

    <section class="section">
        <h2>📝 تمرین</h2>
        <div class="exercise-box">
            <p><strong>تمرین:</strong> فایل <code>file.txt</code> رو با مجوز <code>600</code> تنظیم کن.</p>
        </div>
    </section>

    <section class="section">
        <h2>✅ جواب</h2>
        <pre class="code-block">chmod 600 file.txt
ls -l file.txt</pre>
        <div class="output-box">
            <span class="output-label">خروجی:</span>
            <pre class="code-block-output">-rw-------</pre>
        </div>
    </section>
</div>
