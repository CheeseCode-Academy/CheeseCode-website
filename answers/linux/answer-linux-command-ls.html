<div class="lesson-content" dir="auto">
    <h1 class="lesson-title">🧀 جواب درس: دستور ls</h1>
    <div class="lesson-meta">سطح: مقدماتی | جواب تمرین</div>

    <section class="section">
        <h2>📝 تمرین‌ها</h2>
        <div class="exercise-box">
            <p><strong>تمرین ۱:</strong> با <code>ls -l</code> لیست فایل‌ها رو ببین.</p>
            <p><strong>تمرین ۲:</strong> با <code>ls -la</code> فایل‌های مخفی رو ببین.</p>
            <p><strong>تمرین ۳:</strong> با <code>ls -lhS</code> بر اساس حجم مرتب کن.</p>
        </div>
    </section>

    <section class="section">
        <h2>✅ جواب‌ها</h2>
        <ul>
            <li><strong>تمرین ۱:</strong> <code>ls -l /etc</code></li>
            <li><strong>تمرین ۲:</strong> <code>ls -la /etc</code></li>
            <li><strong>تمرین ۳:</strong> <code>ls -lhS /etc</code></li>
        </ul>
    </section>
</div>
