<div class="lesson-content" dir="auto">
    <h1 class="lesson-title">🧀 جواب درس ۱: مقدمه</h1>
    <div class="lesson-meta">سطح: مقدماتی | جواب تمرین</div>

    <section class="section">
        <h2>📝 تمرین</h2>
        <div class="exercise-box">
            <p><strong>تمرین:</strong> به نظرت چرا یادگیری لینوکس مهمه؟ سه تا دلیل بیار.</p>
        </div>
    </section>

    <section class="section">
        <h2>✅ جواب</h2>
        <ul>
            <li><strong>استفاده در سرورها:</strong> اکثر سرورهای دنیا روی لینوکس اجرا میشن.</li>
            <li><strong>رایگان و متن‌باز:</strong> می‌تونی آزادانه استفاده و تغییرش بدی.</li>
            <li><strong>امنیت بالا:</strong> لینوکس در برابر ویروس‌ها مقاوم‌تره.</li>
        </ul>
    </section>
</div>
